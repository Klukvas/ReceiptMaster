version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: market_postgres_dev
    environment:
      - POSTGRES_DB=market_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"  # host 5433 to avoid conflict with local PostgreSQL on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - market_network

  redis:
    image: redis:7-alpine
    container_name: market_redis_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - market_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.playwright
    container_name: market_backend_dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=market_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_PREFIX=api/v1
      - API_KEY=dev-api-key
      - JWT_SECRET=pSPmil4N/FLgTDuIOhrGY17ne5Vk454z4dSa/shpbvQ=
      - RECEIPT_STORAGE_PATH=/app/receipts
      - RECEIPT_BASE_URL=http://localhost:3000
      - AWS_ACCESS_KEY_ID=Q4VEDK3ALS0P6HS3IU54
      - AWS_SECRET_ACCESS_KEY=nDhkjzjVWRJF2nHOYxOuvnETUv8wsAkOXhUKLQ9N
      - AWS_REGION=nbg1
      - S3_ENDPOINT=https://nbg1.your-objectstorage.com
      - LOGOS_BUCKET=marketflow-storage
      - RECEIPTS_BUCKET=marketflow-storage
      - TEMP_BUCKET=marketflow-storage
      - AUTO_RUN_MIGRATIONS=true
    volumes:
      - ./backend:/app
      - /app/node_modules
      - receipts_dev:/app/receipts
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["yarn", "start:dev"]
    networks:
      - market_network

  frontend:
    image: node:20-alpine
    container_name: market_frontend_dev
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
      - VITE_API_KEY=dev-api-key
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    networks:
      - market_network

volumes:
  postgres_data_dev:
  receipts_dev:

networks:
  market_network:
    driver: bridge

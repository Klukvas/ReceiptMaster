name: "Deploy Application Server"

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.app.yml'
      - '.github/workflows/deploy-application.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set repository name to lowercase
        run: |
          echo "REPO_NAME_LOWER=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.FRONTEND_API_URL }}
            VITE_API_KEY=${{ secrets.FRONTEND_API_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:latest
          labels: |
            org.opencontainers.image.title=MarketFlow Frontend
            org.opencontainers.image.description=React frontend for MarketFlow trading service
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          no-cache: true

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:latest
          labels: |
            org.opencontainers.image.title=MarketFlow Backend
            org.opencontainers.image.description=NestJS backend for MarketFlow trading service
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          no-cache: true

      - name: Deploy Application Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            export DOCKER_CLIENT_TIMEOUT=${DOCKER_CLIENT_TIMEOUT:-600}
            export COMPOSE_HTTP_TIMEOUT=${COMPOSE_HTTP_TIMEOUT:-600}

            # Setup application directory
            sudo mkdir -p /opt/market && sudo chown $USER:$USER /opt/market
            cd /opt/market
            if [ ! -d market ]; then
              git clone https://github.com/${{ github.repository }}.git market
            fi
            cd market
            git fetch --all -q
            git reset --hard origin/main -q

            # Write application env
            cat > .env << 'EOF'
            # Database configuration
            DB_HOST=${{ secrets.DB_PRIVATE_IP }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}

            # Application configuration
            API_KEY=${{ secrets.API_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            RECEIPT_BASE_URL=${{ secrets.RECEIPT_BASE_URL }}

            # Frontend configuration
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}

            # GitHub repository
            GITHUB_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            EOF

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Retry helper
            retry() {
              local n=0
              local max=5
              local delay=10
              until "$@"; do
                n=$((n+1))
                if [ $n -ge $max ]; then
                  echo "Command failed after $n attempts: $*" >&2
                  return 1
                fi
                echo "Retry $n/$max..."
                sleep $delay
              done
            }

            # Deploy application
            echo "🚀 Deploying application server..."
            retry docker compose -f docker-compose.application.yml pull
            retry docker compose -f docker-compose.application.yml up -d --remove-orphans

            # Health check
            echo "⏳ Waiting for application to be ready..."
            sleep 30
            
            # Check application status
            if curl -fsS http://localhost:3000/api/v1/health > /dev/null; then
              echo "✅ Application deployed successfully!"
            else
              echo "❌ Application deployment failed!"
              docker compose -f docker-compose.application.yml logs
              exit 1
            fi
            
            docker compose -f docker-compose.application.yml ps

      - name: Generate deployment summary
        run: |
          echo "## 🚀 Application Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: http://${{ secrets.APP_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API**: http://${{ secrets.APP_HOST }}:3000/api/v1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Images" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

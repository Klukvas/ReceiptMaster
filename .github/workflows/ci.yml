name: "CI: Test, Build, and Deploy"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: |
            backend/yarn.lock
            yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Run tests with coverage
        run: yarn test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          if [ -f ../coverage/coverage-summary.json ]; then
            echo "## Backend Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('../coverage/coverage-summary.json').total;
              const fmt = (v) => v.pct + '%';
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| Statements | ' + fmt(r.statements) + ' |');
              console.log('| Branches | ' + fmt(r.branches) + ' |');
              console.log('| Functions | ' + fmt(r.functions) + ' |');
              console.log('| Lines | ' + fmt(r.lines) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build application
        run: yarn build

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@klukvas'
          cache: 'yarn'
          cache-dependency-path: |
            frontend/yarn.lock
            yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run linting
        run: yarn lint

      - name: Generate API types from OpenAPI spec
        run: yarn openapi:generate

      - name: Build application
        run: yarn build

  contract-test:
    name: "Contract: Frontend ↔ Backend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@klukvas'
          cache: 'yarn'
          cache-dependency-path: |
            frontend/yarn.lock
            yarn.lock

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate types from OpenAPI spec
        working-directory: ./frontend
        run: yarn openapi:generate

      - name: Validate contract (tsc --noEmit)
        working-directory: ./frontend
        run: yarn typecheck

      - name: Contract summary
        if: always()
        run: |
          echo "## Contract Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validated frontend types against \`backend/openapi.json\` spec." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If this job fails, a backend API change broke the frontend contract." >> $GITHUB_STEP_SUMMARY
          echo "Fix: update \`openapi.json\` (\`yarn openapi:export\`) and regenerate types." >> $GITHUB_STEP_SUMMARY

  e2e-backend:
    name: "E2E: Backend API"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_db_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: |
            backend/yarn.lock
            yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5435
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: market_db_test
          JWT_SECRET: test-jwt-secret-at-least-32-characters-long
          API_PREFIX: api/v1
          AUTO_RUN_MIGRATIONS: 'true'
          API_KEY: test-api-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          TELEGRAM_BOT_TOKEN: test-telegram-bot-token
          TELEGRAM_BOT_OWNER_USER_ID: 00000000-0000-0000-0000-000000000000

      - name: E2E summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend API end-to-end tests against a real PostgreSQL database." >> $GITHUB_STEP_SUMMARY

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, contract-test, e2e-backend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set repository name to lowercase
        run: |
          echo "REPO_NAME_LOWER=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            klukvas/receiptmaster-frontend
            klukvas/receiptmaster-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.FRONTEND_API_URL }}
            VITE_API_KEY=${{ secrets.FRONTEND_API_KEY }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            klukvas/receiptmaster-frontend:${{ github.sha }}
            klukvas/receiptmaster-frontend:latest
          labels: |
            org.opencontainers.image.title=MarketFlow Frontend
            org.opencontainers.image.description=React frontend for MarketFlow trading service
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          no-cache: true

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.playwright
          push: true
          tags: |
            klukvas/receiptmaster-backend:${{ github.sha }}
            klukvas/receiptmaster-backend:latest
          labels: |
            org.opencontainers.image.title=MarketFlow Backend
            org.opencontainers.image.description=NestJS backend for MarketFlow trading service
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          no-cache: true

      - name: Generate deployment summary
        run: |
          echo "## 🐳 Docker Images Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            echo "### 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Service | Image | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Frontend | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:latest\` | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
            echo "| Backend | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:latest\` | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 Registry Links" >> $GITHUB_STEP_SUMMARY
            echo "- [Frontend Package](https://${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend)" >> $GITHUB_STEP_SUMMARY
            echo "- [Backend Package](https://${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Update your production environment to use the new images" >> $GITHUB_STEP_SUMMARY
            echo "2. Monitor the deployment for any issues" >> $GITHUB_STEP_SUMMARY
            echo "3. Update your docker-compose.yml with the new image tags if needed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📦 Built Images" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Service | Image | Context |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|---------|" >> $GITHUB_STEP_SUMMARY
            echo "| Frontend | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:${{ github.sha }}\` | \`./frontend\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Backend | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:${{ github.sha }}\` | \`./backend\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Usage" >> $GITHUB_STEP_SUMMARY
            echo "You can now pull these images using:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy Application Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            export DOCKER_CLIENT_TIMEOUT=${DOCKER_CLIENT_TIMEOUT:-600}
            export COMPOSE_HTTP_TIMEOUT=${COMPOSE_HTTP_TIMEOUT:-600}

            # Setup application directory
            sudo mkdir -p /opt/market && sudo chown $USER:$USER /opt/market
            cd /opt/market
            if [ ! -d market ]; then
              git clone https://github.com/${{ github.repository }}.git market
            fi
            cd market
            git fetch --all -q
            git reset --hard origin/main -q

            # Write application env
            cat > .env << 'EOF'
            # Database configuration
            DB_HOST=${{ secrets.DB_PRIVATE_IP }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}

            # Application configuration
            API_KEY=${{ secrets.API_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            RECEIPT_BASE_URL=${{ secrets.RECEIPT_BASE_URL }}
            AUTO_RUN_MIGRATIONS=true

            # S3 Object Storage configuration
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
            LOGOS_BUCKET=${{ secrets.LOGOS_BUCKET }}
            RECEIPTS_BUCKET=${{ secrets.RECEIPTS_BUCKET }}
            TEMP_BUCKET=${{ secrets.TEMP_BUCKET }}

            # Frontend configuration
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}

            # Docker Hub configuration
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            EOF

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Retry helper
            retry() {
              local n=0
              local max=5
              local delay=10
              until "$@"; do
                n=$((n+1))
                if [ $n -ge $max ]; then
                  echo "Command failed after $n attempts: $*" >&2
                  return 1
                fi
                echo "Retry $n/$max..."
                sleep $delay
              done
            }

            # Deploy application
            echo "🚀 Deploying application server..."
            retry docker compose -f docker-compose.application.yml pull
            retry docker compose -f docker-compose.application.yml up -d --remove-orphans

            # Health check
            echo "⏳ Waiting for application to be ready..."
            sleep 30
            curl -fsS http://localhost:3000/api/v1/health || true
            docker compose -f docker-compose.application.yml ps


name: "CI: Test, Build, and Deploy"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    env:
      GITHUB_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker images build from ./backend and ./frontend, which cannot see the
      # root lock, so each package carries a byte-for-byte copy of it.
      - name: Verify package lockfiles match the root yarn.lock
        run: |
          status=0
          for lock in backend/yarn.lock frontend/yarn.lock; do
            if ! cmp -s ../yarn.lock "../$lock"; then
              echo "::error file=$lock::$lock differs from the root yarn.lock. From the repository root run: cp yarn.lock $lock"
              status=1
            fi
          done
          exit "$status"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@klukvas"
          cache: "yarn"
          cache-dependency-path: |
            backend/yarn.lock
            yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run linting
        run: yarn lint

      - name: Run tests with coverage
        run: yarn test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          if [ -f ../coverage/coverage-summary.json ]; then
            echo "## Backend Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('../coverage/coverage-summary.json').total;
              const fmt = (v) => v.pct + '%';
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| Statements | ' + fmt(r.statements) + ' |');
              console.log('| Branches | ' + fmt(r.branches) + ' |');
              console.log('| Functions | ' + fmt(r.functions) + ' |');
              console.log('| Lines | ' + fmt(r.lines) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build application
        run: yarn build

  test-frontend:
    env:
      GITHUB_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@klukvas"
          cache: "yarn"
          cache-dependency-path: |
            frontend/yarn.lock
            yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run linting
        run: yarn lint

      - name: Generate API types from OpenAPI spec
        run: yarn openapi:generate

      - name: Build application
        run: yarn build

  contract-test:
    env:
      GITHUB_TOKEN: ${{ github.token }}
    name: "Contract: Frontend ↔ Backend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@klukvas"
          cache: "yarn"
          cache-dependency-path: |
            frontend/yarn.lock
            yarn.lock

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Yarn workspace install above also installs the backend. The exporter
      # boots Nest in preview mode, so no database, Redis or other service is needed.
      - name: Build backend
        working-directory: ./backend
        run: yarn build

      - name: Verify backend/openapi.json matches the code
        working-directory: ./backend
        run: node dist/openapi/generate-openapi.js --check

      - name: Generate types from OpenAPI spec
        working-directory: ./frontend
        run: yarn openapi:generate

      - name: Validate contract (tsc --noEmit)
        working-directory: ./frontend
        run: yarn typecheck

      - name: Contract summary
        if: always()
        run: |
          echo "## Contract Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validated \`backend/openapi.json\` against the backend code, then frontend types against it." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If this job fails, the API changed without its contract, or the contract change broke the frontend." >> $GITHUB_STEP_SUMMARY
          echo "Fix: run \`yarn openapi:export\` in backend/, commit \`backend/openapi.json\`, then regenerate types and fix the frontend." >> $GITHUB_STEP_SUMMARY

  e2e-backend:
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # The PostgreSQL integration suites create and drop their own databases and a
      # restricted NOSUPERUSER/NOBYPASSRLS role. They only dial their fixed loopback
      # ports, require the sentinel database created below, refuse a cluster holding
      # market_db, and fail instead of skipping here.
      AUDIT_PG_PORT: "55439"
      TEMPLATE_PG_PORT: "55447"
      ISOLATED_PG_USER: postgres
      ISOLATED_PG_PASSWORD: postgres
      REQUIRE_PG_SUITES: "1"
    name: "E2E: Backend API"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_db_test
        ports:
          - 5435:5432
          - 55439:5432
          - 55447:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@klukvas"
          cache: "yarn"
          cache-dependency-path: |
            backend/yarn.lock
            yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The suites refuse any cluster without this sentinel database. Both mapped
      # ports reach the same service container, so marking it once covers both.
      - name: Mark the service cluster as disposable for the PostgreSQL suites
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 55439 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE receiptmaster_isolated_pg_sentinel"

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5435
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: market_db_test
          JWT_SECRET: test-jwt-secret-at-least-32-characters-long
          API_PREFIX: api/v1
          AUTO_RUN_MIGRATIONS: "true"
          API_KEY: test-api-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          TELEGRAM_BOT_TOKEN: test-telegram-bot-token
          TELEGRAM_BOT_OWNER_USER_ID: 00000000-0000-0000-0000-000000000000

      # Lives under src/ with the unit tests, which skip it without the opt-in above.
      - name: Run tenant RLS integration suite
        run: yarn jest --ci --runInBand src/common/tenancy/tenant-data-source.pg.spec.ts

      - name: E2E summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend API end-to-end tests against a real PostgreSQL database." >> $GITHUB_STEP_SUMMARY
          echo "PostgreSQL integration suites (orders audit, document SQL/RLS, tenant RLS) ran under a restricted non-owner role." >> $GITHUB_STEP_SUMMARY

  browser-regression:
    env:
      GITHUB_TOKEN: ${{ github.token }}
    name: "Browser: regression suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@klukvas"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # proxy-audit runs the production nginx.conf through a local nginx and openssl.
      - name: Check proxy-audit tools
        run: |
          nginx -v
          openssl version

      - name: Generate API types from OpenAPI spec
        working-directory: ./frontend
        run: yarn openapi:generate

      # run.mjs starts its own Vite dev server and fails when a spec records no checks.
      - name: Run browser regression suite
        run: node frontend/e2e/run.mjs

  browser-documents:
    env:
      GITHUB_TOKEN: ${{ github.token }}
    name: "Browser: document features"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@klukvas"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Playwright's bundled Chromium with its default (disabled) sandbox, like the
      # production PDF renderer, so Ubuntu's user-namespace restriction does not apply.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate API types from OpenAPI spec
        working-directory: ./frontend
        run: yarn openapi:generate

      # The fixture serves the built stylesheet from frontend/dist/assets.
      - name: Build frontend
        working-directory: ./frontend
        run: yarn build

      # Real Nest controllers/services, React and Chromium PDF rendering over synthetic
      # in-memory persistence and storage; it never connects to a real service.
      - name: Start synthetic document fixture
        working-directory: ./backend
        env:
          TEMPLATE_EVIDENCE: ${{ runner.temp }}/template-features
        run: |
          mkdir -p "$TEMPLATE_EVIDENCE"
          nohup yarn --silent ts-node --transpile-only test/serve-template-features.ts \
            > "$TEMPLATE_EVIDENCE/fixture.log" 2>&1 &
          fixture=$!
          for attempt in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4327/fixture/state > /dev/null; then
              echo "Fixture ready after $attempt checks"
              exit 0
            fi
            if ! kill -0 "$fixture" 2> /dev/null; then
              echo "::error::Document fixture exited before serving"
              cat "$TEMPLATE_EVIDENCE/fixture.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::Document fixture did not serve http://127.0.0.1:4327 within 180s"
          cat "$TEMPLATE_EVIDENCE/fixture.log"
          exit 1

      - name: Run document feature suite
        env:
          TEMPLATE_EVIDENCE: ${{ runner.temp }}/template-features
        run: node frontend/e2e/template-features.cjs

      # Synthetic data only: screenshots, preview PDF, results and the fixture log.
      - name: Upload document evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: template-features-evidence
          path: ${{ runner.temp }}/template-features
          retention-days: 7

  build-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend
      - contract-test
      - e2e-backend
      - browser-regression
      - browser-documents
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            VITE_API_URL=${{ secrets.FRONTEND_API_URL }}
            VITE_API_KEY=${{ secrets.FRONTEND_API_KEY }}
            VITE_BILLING_ENABLED=false
            VITE_PADDLE_CLIENT_TOKEN=
            VITE_PADDLE_ENVIRONMENT=production
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/receiptmaster-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=MarketFlow Frontend
            org.opencontainers.image.description=React frontend for MarketFlow trading service
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          no-cache: true

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.playwright
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/receiptmaster-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=MarketFlow Backend
            org.opencontainers.image.description=NestJS backend for MarketFlow trading service
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          no-cache: true

      - name: Generate publication summary
        run: |
          echo "## Docker Hub images published" >> $GITHUB_STEP_SUMMARY
          echo 'Frontend: `${{ secrets.DOCKERHUB_USERNAME }}/receiptmaster-frontend:${{ github.sha }}`' >> $GITHUB_STEP_SUMMARY
          echo 'Backend: `${{ secrets.DOCKERHUB_USERNAME }}/receiptmaster-backend:${{ github.sha }}`' >> $GITHUB_STEP_SUMMARY
          echo "Deployment is reported separately by deploy-production." >> $GITHUB_STEP_SUMMARY

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4

      - name: Prepare reviewed precheck and allowlisted release
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'precheck=%s\n' "$(base64 -w0 scripts/deploy-production.sh)" >> "$GITHUB_OUTPUT"
          mkdir release-bundle
          printf '%s\n' "$RELEASE_SHA" > release-bundle/release.sha
          cp docker-compose.production.yml release-bundle/
          cp scripts/deploy-production.sh release-bundle/
          tar -C release-bundle -czf release.tar.gz release.sha docker-compose.production.yml deploy-production.sh
          sha256sum release.tar.gz > release.tar.gz.sha256

      - name: Read-only production precheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            printf '%s' '${{ steps.release.outputs.precheck }}' | base64 -d | bash -s -- precheck /opt/market/market '${{ github.sha }}' '${{ github.run_id }}-${{ github.run_attempt }}' '${{ secrets.DOCKERHUB_USERNAME }}'

      - name: Transfer unique allowlisted release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: release.tar.gz,release.tar.gz.sha256
          target: /opt/market/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: false

      - name: Backup, migrate and deploy immutable application pair
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -eu
            cd '/opt/market/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'
            sha256sum --check release.tar.gz.sha256
            test "$(tar -tzf release.tar.gz | sort | tr '\n' ' ')" = 'deploy-production.sh docker-compose.production.yml release.sha '
            tar -xzf release.tar.gz
            bash deploy-production.sh deploy /opt/market/market '${{ github.sha }}' '${{ github.run_id }}-${{ github.run_attempt }}' '${{ secrets.DOCKERHUB_USERNAME }}'

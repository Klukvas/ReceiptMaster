version: '3.8'

services:
  # Run migrations before starting backend: docker-compose -f docker-compose.application.yml run --rm migrations
  migrations:
    image: ${DOCKERHUB_USERNAME:-klukvas}/receiptmaster-backend:latest
    container_name: marketflow-migrations
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-10.0.1.20}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-market_db}
    command: ["yarn", "migration:run"]
    networks:
      - marketflow-network

  frontend:
    image: ${DOCKERHUB_USERNAME:-klukvas}/receiptmaster-frontend:latest
    container_name: marketflow-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api/v1}
      - VITE_API_KEY=${VITE_API_KEY}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - marketflow-network

  redis:
    image: redis:7-alpine
    container_name: marketflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - marketflow-network

  backend:
    image: ${DOCKERHUB_USERNAME:-klukvas}/receiptmaster-backend:latest
    container_name: marketflow-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=${DB_HOST:-10.0.1.20}  # Private IP of DB server
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-market_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_PREFIX=api/v1
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - RECEIPT_STORAGE_PATH=/app/receipts
      - RECEIPT_BASE_URL=${RECEIPT_BASE_URL:-http://localhost:3000}
      - AUTO_RUN_MIGRATIONS=false
      # S3 Object Storage Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-nbg1}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - LOGOS_BUCKET=${LOGOS_BUCKET:-marketflow-storage}
      - RECEIPTS_BUCKET=${RECEIPTS_BUCKET:-marketflow-storage}
      - TEMP_BUCKET=${TEMP_BUCKET:-marketflow-storage}
    volumes:
      - receipts:/app/receipts
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - marketflow-network

volumes:
  receipts:

networks:
  marketflow-network:
    driver: bridge
